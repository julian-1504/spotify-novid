name: Deploy to Cloudflare Pages

# Manual trigger only. There is deliberately no `push` or `pull_request`
# trigger: a deploy replaces what the kids are actually listening on, so it is
# always a decision someone makes, never a side effect of merging.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        type: choice
        default: preview
        options:
          - preview
          - production

concurrency:
  group: deploy-${{ github.event.inputs.target }}
  cancel-in-progress: false

env:
  # Must match the Cloudflare Pages project name. The project has to exist
  # first — `wrangler pages deploy` cannot create one non-interactively.
  PROJECT_NAME: spotify-novid
  # Must match the Pages project's production branch (set at creation with
  # `wrangler pages project create --production-branch=main`). Pages classifies
  # a deploy as production purely by --branch matching this value, so the whole
  # preview/production distinction hinges on it.
  PRODUCTION_BRANCH: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # Vite inlines VITE_-prefixed variables at build time, so the client ID
      # has to be present in *this* step's environment. Without it the build
      # still succeeds and ships a bundle that fails at the first login
      # attempt — a failure that never reproduces locally, where .env exists.
      - run: npm run build
        env:
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}

      # Scans dist/, so it must run after the build. This is the gate that
      # keeps the app's core promise mechanical rather than aspirational.
      - run: npm run check:novideo

      # Resolved in its own step, and printed, because the branch name is the
      # only thing deciding whether this lands on the live site. An earlier
      # inline expression fell back to the current ref for previews, which on a
      # single-branch repo meant every "preview" was a production deploy — with
      # nothing in the log to say so.
      #
      # TARGET/REF_NAME arrive via env rather than being interpolated into the
      # script, since branch names may carry shell metacharacters.
      - id: target
        env:
          TARGET: ${{ github.event.inputs.target }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$TARGET" = "production" ]; then
            if [ "$REF_NAME" != "$PRODUCTION_BRANCH" ]; then
              echo "::error::Refusing to deploy to production from '$REF_NAME'. Production ships what is on $PRODUCTION_BRANCH."
              exit 1
            fi
            branch="$PRODUCTION_BRANCH"
          else
            # Prefixed so a preview can never collide with the production
            # branch, whatever the current ref is called.
            branch="preview-$REF_NAME"
            # Unreachable given the prefix above. Kept so the invariant is
            # mechanical: change the scheme and this fails the run rather than
            # quietly deploying to production.
            if [ "$branch" = "$PRODUCTION_BRANCH" ]; then
              echo "::error::Preview resolved to the production branch '$branch'."
              exit 1
            fi
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Target '$TARGET' from '$REF_NAME' -> deploying as branch '$branch'"

      # Direct Upload: the bundle is built here and pushed as static assets, so
      # Cloudflare never runs a build of its own. The app has no Pages
      # Functions (no functions/, no _worker.js) — the /* -> /index.html rule
      # in public/_redirects is served by the static asset router — so this
      # consumes no Workers request quota.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Production iff this matches PRODUCTION_BRANCH; see the step above.
          command: >-
            pages deploy dist
            --project-name=${{ env.PROJECT_NAME }}
            --branch=${{ steps.target.outputs.branch }}
