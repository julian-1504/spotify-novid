org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true

# The site the app renders. Kept a property rather than a constant so a preview
# build needs no source change:
#
#   ./gradlew assembleDebug -Pklangkiste.siteUrl=https://preview-main.spotify-novid.pages.dev
#
# Whatever is set here must be registered as a Spotify redirect URI (with
# /callback appended), because src/config.ts derives the redirect from
# window.location.origin — the app's origin is this URL, not the APK.
klangkiste.siteUrl=https://spotify-novid.pages.dev
