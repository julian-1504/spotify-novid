org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true

# The site the app renders. Kept a property rather than a constant so a preview
# build needs no source change:
#
#   ./gradlew assembleDebug -Pklangkiste.siteUrl=https://preview-main.spotify-novid.pages.dev
#
# Whatever is set here must be registered as a Spotify redirect URI (with
# /callback appended), because src/config.ts derives the redirect from
# window.location.origin — the app's origin is this URL, not the APK.
klangkiste.siteUrl=https://spotify-novid.pages.dev

# Defaults for a local build. The release workflow overrides both — versionName
# from the version you type when running it, versionCode from the run number —
# so cutting a release needs no commit here.
#
# These stay put rather than being bumped by hand: nothing reads them except a
# local build, and a stale number in the repo is less confusing than one that
# disagrees with the last published APK.
klangkiste.versionCode=1
klangkiste.versionName=1.0
